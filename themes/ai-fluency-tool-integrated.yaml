# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palette:
    background-color: transparent
    cloud-text-aws: '#ff9800'
    cloud-text-azure: '#3391f0'
    cloud-text-gcp: '#679b00'
    error-text: '#eb4034'
    first-row-icon: '#65acf7'
    git-text: '#65acf7'
    kubernetes-text: '#93DA97'
    python-text: '#93DA97'
    third-left-prompt: '#65acf7'
    user: '#d19a66'
    white-text: '#ffffff'
    wording: '#a8e05e'
console_title_template: '{{ .Folder }}'
blocks:
    - type: prompt
      alignment: left
      segments:
        - options:
            display_host: true
          leading_diamond: "<p:first-row-icon>\U000F01E5 </>"
          template: '{{ if .SSHSession }} {{ if .Root }} <p:white-text>isRoot{{ end }}{{ end }}{{ .UserName }}{{ if .SSHSession }}@{{.HostName}}{{ end }} <p:white-text>@</>'
          foreground: p:user-text
          type: session
          style: diamond
        - options:
            fetch_status: true
            fetch_upstream_icon: true
          alias: gitSeg
          template: ' {{ .UpstreamIcon }} {{ .RepoName }} {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }}|{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
          foreground: p:git-text
          type: git
          style: diamond
        - template: '{{ if .Segments.Contains "gitSeg" }}{{else}}   {{.Folder}} {{ end }}</>'
          type: text
          style: plain
        - options:
            display_mode: environment
            fetch_virtual_env: true
            home_enabled: true
          template: '|  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }}{{ end }}{{ end }}'
          foreground: p:python-text
          type: python
          style: diamond
      newline: true
    - type: prompt
      alignment: left
      newline: true
      segments:
        - options:
            folder_icon: '...'
            folder_separator_icon: /
            home_icon: home
            max_depth: 2
            style: agnoster_short
          template: ' {{ .Path }} '
          foreground: p:wording
          type: path
          style: plain
    - type: prompt
      alignment: right
      segments:
        - options:
            always_enabled: true
          template: '{{ if eq .Code 0 }}<p:first-row-icon>{{ else }}<p:error-text>{{ end }}'
          type: status
          style: plain
        - options:
            style: dallas
            threshold: 0
          template: ' {{ .FormattedMs }}s <p:white-text>| </>'
          foreground: p:wording
          type: executiontime
          style: plain
        - options:
            time_format: _2 Jan 2006(Mon)<p:white-text>,</>15:04
          template: '{{ .CurrentDate | date .Format }} '
          foreground: p:wording
          type: time
          style: diamond
    # AI-Fluency-Tool Integrated in this section
    # Pre-requisites: Install the AI-Engineering-Fluency and ensure it is accessible in your system's PATH.
    # https://github.com/rajbos/ai-engineering-fluency
    - type: prompt
      alignment: right
      newline: true
      segments:
        - options:
            style: dallas
            threshold: 0
          cache: 
            duration: 5m
            strategy: session
          template: ' {{ cmd "ai-engineering-fluency" "segment" }} '
          foreground: p:wording
          type: text
          style: diamond
    - type: prompt
      alignment: left
      segments:
        - template: ' '
          foreground: p:third-left-prompt
          type: text
          style: plain
      newline: true
tooltips:
    - options:
        parse_kubeconfig: true
      template: "\U000F0833 {{.Context}}"
      foreground: p:kubernetes-text
      type: kubectl
      style: plain
      tips:
        - kubectl
        - kubectx
        - kube
        - k
        - helm
        - k9s
    - template: "<b>\U000F0E0F</b> {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }}"
      foreground: p:cloud-text-aws
      type: aws
      style: plain
      tips:
        - aws
        - terraform
        - tofu
    - options:
        source: cli
      template: '{{if .TenantDisplayName}} {{ .Name }}{{ end }}'
      foreground: p:cloud-text-azure
      type: az
      style: plain
      tips:
        - az
        - terraform
        - tofu
    - template: '{{ if .Error }}{{ .Error }}{{ else }} {{ .Project }}{{ end }} '
      foreground: p:cloud-text-gcp
      type: gcp
      style: plain
      tips:
        - gcloud
        - terraform
        - tofu
version: 4
